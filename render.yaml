services:
  - type: web
    name: rentaway-api
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/db/bootstrapAdmin.js && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/rentaway.db
      - key: UPLOADS_DIR
        value: /tmp/rentaway-uploads
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_NAME
        value: RentAway Administrator
